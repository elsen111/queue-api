version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: smart-queue-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_queue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smart_queue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: smart-queue-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/smart_queue
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: c2VjcmV0LWtleS1mb3Itc21hcnQtcXVldWUtYXBpLWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  smart_queue_pgdata: