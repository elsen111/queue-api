server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-queue-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_queue}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3Itc21hcnQtcXVldWUtYXBpLWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:30}
  refill-tokens: ${RATE_LIMIT_REFILL:30}
  refill-duration-seconds: ${RATE_LIMIT_DURATION:60}

app:
  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-password: ${ADMIN_PASSWORD:admin123}