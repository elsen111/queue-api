databaseChangeLog:
  - changeSet:
      id: 001-create-customers-table
      author: elshan

      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: varchar(30)

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

              - column:
                  name: called_at
                  type: timestamp with time zone

              - column:
                  name: completed_at
                  type: timestamp with time zone

        - createIndex:
            tableName: customers
            indexName: idx_customers_status_created_at
            columns:
              - column:
                  name: status

              - column:
                  name: created_at